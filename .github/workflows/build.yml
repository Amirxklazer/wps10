name: Build Switch Homebrew

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2 packages (with retry)
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            echo "Attempt $i"
            if dkp-pacman -Syu --noconfirm && \
               dkp-pacman -S --noconfirm --needed \
                 switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-sdl2_gfx; then
              echo "OK"; break
            fi
            sleep 20
          done

      - name: Build
        run: make

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: winphone-sim-nro
          path: "*.nro"
