name: Build Switch Homebrew

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: winphone-sim-nro
          path: "*.nro"
